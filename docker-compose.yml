version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: mysql-container
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: Nikunj@123
      MYSQL_DATABASE: pubs_dev

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - springboot-network

  springboot-app:
    build: .
    container_name: springboot-container

    depends_on:
      - mysql

    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/pubs_dev
      DB_USER: root
      DB_PASS: Nikunj@123

    ports:
      - "8082:8082"

    networks:
      - springboot-network

volumes:
  mysql-data:

networks:
  springboot-network: